# Web app dei pazienti: test e build a ogni push e pull request che tocca web/ o il codice condiviso.
name: Web app paziente

on:
  push:
    branches: [main]
    paths: ['web/**', 'app/src/patientApp/**', 'app/src/lib/**', 'app/src/db/types.ts', 'app/src/db/planData.ts', 'app/src/db/noteTemplates.ts', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'app/src/patientApp/**', 'app/src/lib/**', 'app/src/db/types.ts', 'app/src/db/planData.ts', 'app/src/db/noteTemplates.ts', '.github/workflows/web.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-paziente
          path: web/dist
