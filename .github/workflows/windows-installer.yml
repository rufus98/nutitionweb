# Crea gli installer Windows (.msi e .exe) su un runner Windows e li pubblica come artifact.
# Si avvia a ogni push su main, sui tag v* e manualmente da "Actions → Run workflow".
name: Installer Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer (MSI + NSIS)
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: nutrea-studio-windows
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Sui tag v* allega gli installer a una release GitHub (in bozza).
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
