# Pubblicazione su Netlify (Base directory = web): sito statico + funzione delle API dei pazienti (netlify/functions/patient.ts).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pagine dei pazienti: l'app è una sola pagina.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
